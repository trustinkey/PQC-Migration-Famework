      # DOMAINE 5 — CRYPTO-AGILITÉ ET IMPLÉMENTATION
      # ============================================================
      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5
        assessable: false
        depth: 1
        ref_id: D5
        name: "Crypto-Agilité et Implémentation Technique"
        translations:
          en:
            name: "Crypto-Agility and Technical Implementation"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-G1
        assessable: false
        depth: 2
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5
        ref_id: D5-G1
        name: "Architecture Crypto-Agile"
        translations:
          en:
            name: "Crypto-Agile Architecture"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-01
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-G1
        ref_id: D5-01
        name: "Abstraction cryptographique implémentée (couche crypto-agile)"
        description: >
          Les applications n'appellent pas directement des primitives cryptographiques
          mais une couche d'abstraction configurable (ex: provider pattern).
          Remplacement d'algorithme sans recompilation des applications.
          Délai de basculement d'algorithme testé et documenté (objectif < 48h).
        importance: mandatory
        translations:
          en:
            name: "Cryptographic abstraction implemented (crypto-agile layer)"
            description: >
              Applications do not call cryptographic primitives directly
              but a configurable abstraction layer (e.g., provider pattern).
              Algorithm replacement without application recompilation.
              Algorithm switchover time tested and documented (target < 48h).

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-02
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-G1
        ref_id: D5-02
        name: "Bibliothèques cryptographiques PQC qualifiées utilisées"
        description: >
          Seules des bibliothèques PQC éprouvées et maintenues sont utilisées en production :
          liboqs (Open Quantum Safe), BouncyCastle PQC, OpenSSL 3.x avec provider PQC.
          Aucune implémentation cryptographique maison pour les primitives PQC.
          Veille sur les vulnérabilités des bibliothèques utilisées (CVE, bulletins).
        importance: mandatory
        translations:
          en:
            name: "Qualified PQC cryptographic libraries used"
            description: >
              Only proven and maintained PQC libraries used in production:
              liboqs (Open Quantum Safe), BouncyCastle PQC, OpenSSL 3.x with PQC provider.
              No home-built cryptographic implementations for PQC primitives.
              Vulnerability monitoring for used libraries (CVE, advisories).

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-03
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-G1
        ref_id: D5-03
        name: "Tests de performance PQC effectués en conditions de production"
        description: >
          Benchmarks de performance PQC documentés en conditions réalistes :
          Latence TLS handshake avec ML-KEM (target < 2x latence classique).
          Débit de vérification de signatures ML-DSA sur les serveurs d'authentification.
          Impact CPU/mémoire sur les équipements réseau (firewalls, load balancers).
          Plan de capacité mis à jour en conséquence.
        importance: mandatory
        translations:
          en:
            name: "PQC performance tests conducted under production conditions"
            description: >
              PQC performance benchmarks documented under realistic conditions:
              TLS handshake latency with ML-KEM (target < 2x classical latency).
              ML-DSA signature verification throughput on authentication servers.
              CPU/memory impact on network equipment (firewalls, load balancers).
              Capacity plan updated accordingly.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-G2
        assessable: false
        depth: 2
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5
        ref_id: D5-G2
        name: "Protocoles Réseau PQC"
        translations:
          en:
            name: "PQC Network Protocols"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-04
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-G2
        ref_id: D5-04
        name: "TLS 1.3 avec suites hybrides PQC déployé"
        description: >
          TLS 1.3 est le minimum obligatoire. TLS 1.2 en voie d'élimination documentée.
          Suites hybrides PQC activées : X25519MLKEM768 (IANA recommandée),
          SecP256r1MLKEM768 (compatibilité maximale).
          TLS 1.0 et TLS 1.1 : désactivés et vérifiés. SSL 3.0 : interdit.
        importance: mandatory
        translations:
          en:
            name: "TLS 1.3 with PQC hybrid cipher suites deployed"
            description: >
              TLS 1.3 is the mandatory minimum. TLS 1.2 documented for elimination.
              PQC hybrid suites enabled: X25519MLKEM768 (IANA recommended),
              SecP256r1MLKEM768 (maximum compatibility).
              TLS 1.0 and TLS 1.1: disabled and verified. SSL 3.0: forbidden.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-05
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-G2
        ref_id: D5-05
        name: "SSH avec algorithmes PQC configuré"
        description: >
          OpenSSH 9.x+ : échange de clés sntrup761x25519-sha512 ou ML-KEM activé.
          Désactivation de ssh-dss (DSA). RSA minimum 3072 bits pendant la transition.
          Ed25519 conservé comme algorithme de signature classique de référence.
          Plan de migration vers ML-DSA pour l'authentification SSH documenté.
        importance: mandatory
        translations:
          en:
            name: "SSH with PQC algorithms configured"
            description: >
              OpenSSH 9.x+: sntrup761x25519-sha512 or ML-KEM key exchange enabled.
              ssh-dss (DSA) disabled. RSA minimum 3072 bits during transition.
              Ed25519 retained as reference classical signature algorithm.
              Migration plan to ML-DSA for SSH authentication documented.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-06
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-G2
        ref_id: D5-06
        name: "VPN IPsec/IKEv2 avec extensions PQC évalué"
        description: >
          Évaluation du support PQC des équipements VPN (IKEv2 + ML-KEM via RFC 9370).
          Équipements sans support PQC identifiés avec calendrier de remplacement.
          Solutions de contournement documentées pour les équipements legacy
          (ex: tunnel TLS hybride PQC en surcouche).
        importance: mandatory
        translations:
          en:
            name: "IPsec/IKEv2 VPN with PQC extensions evaluated"
            description: >
              PQC support evaluation of VPN equipment (IKEv2 + ML-KEM via RFC 9370).
              Equipment without PQC support identified with replacement timeline.
              Workarounds documented for legacy equipment
              (e.g., PQC hybrid TLS tunnel as overlay).

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-07
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D5-G2
        ref_id: D5-07
        name: "Code signing et intégrité logicielle migrés vers PQC"
        description: >
          Les mécanismes de signature de code (firmware, logiciels, mises à jour)
          sont migrés vers ML-DSA ou en mode hybride ECDSA+ML-DSA.
          Priorité maximale : les clés de signature de firmware hard-codées
          ne peuvent pas être mises à jour post-déploiement — migration urgente.
          Pipeline CI/CD intégrant la signature PQC documenté et opérationnel.
        importance: mandatory
        translations:
          en:
            name: "Code signing and software integrity migrated to PQC"
            description: >
              Code signing mechanisms (firmware, software, updates)
              migrated to ML-DSA or ECDSA+ML-DSA hybrid mode.
              Maximum priority: hard-coded firmware signing keys
              cannot be updated post-deployment — urgent migration.
              CI/CD pipeline integrating PQC signing documented and operational.

