urn: urn:trustinkey:risk:library:pqc-migration-anssi-v1
locale: fr
ref_id: PQC-MIGRATION-v1
name: "Framework Migration Post-Quantique (PQC) — TrustInKey / ANSSI"
description: >
  Framework d'audit exhaustif pour la migration vers la cryptographie post-quantique.
  Basé sur le Guide de Sélection d'Algorithmes Cryptographiques de l'ANSSI,
  le NIST CSWP 48, ETSI TS 103 744 et CNSA 2.0.
  Couvre l'inventaire cryptographique, la gouvernance, la migration PKI,
  la crypto-agilité et la conformité réglementaire NIS2/DORA/eIDAS 2.0.
  Conçu pour les auditeurs PKI et RSSI des OIV, banques et administrations françaises.
version: 1
publication_date: 2025-06-25
provider: TrustInKey 
packager: trustinkey
translations:
  en:
    name: "Post-Quantum Cryptography (PQC) Migration Framework — TrustInKey / ANSSI"
    description: >
      Exhaustive audit framework for post-quantum cryptography migration.
      Based on ANSSI Cryptographic Algorithm Selection Guide, NIST CSWP 48,
      ETSI TS 103 744, and CNSA 2.0. Covers cryptographic inventory, governance,
      PKI migration, crypto-agility, and NIS2/DORA/eIDAS 2.0 regulatory compliance.
      Designed for PKI auditors and CISOs in French OIVs, banks, and public administrations.

objects:
  framework:
    urn: urn:trustinkey:risk:framework:pqc-migration-anssi-v1
    ref_id: PQC-MIGRATION-v1
    name: "Framework Migration Post-Quantique (PQC)"
    description: >
      Audit exhaustif de préparation et migration PQC — ANSSI / NIS2 / DORA / eIDAS 2.0
    translations:
      en:
        name: "Post-Quantum Cryptography (PQC) Migration Framework"
        description: >
          Exhaustive PQC readiness and migration audit — ANSSI / NIS2 / DORA / eIDAS 2.0
    requirement_nodes:

      # ============================================================
      # DOMAINE 1 — INVENTAIRE CRYPTOGRAPHIQUE
      # ============================================================
      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1
        assessable: false
        depth: 1
        ref_id: D1
        name: "Inventaire Cryptographique"
        translations:
          en:
            name: "Cryptographic Inventory"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-G1
        assessable: false
        depth: 2
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1
        ref_id: D1-G1
        name: "Découverte et Cartographie des Actifs"
        translations:
          en:
            name: "Asset Discovery and Mapping"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-01
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-G1
        ref_id: D1-01
        name: "Inventaire exhaustif des algorithmes asymétriques en production"
        description: >
          L'organisation dispose d'un inventaire complet et à jour de tous les algorithmes
          à clé publique utilisés (RSA, ECDSA, ECDH, DH, DSA) avec leur localisation,
          taille de clé, durée de vie et criticité. Référence ANSSI : Guide Sélection Algo §3.
        importance: mandatory
        translations:
          en:
            name: "Exhaustive inventory of asymmetric algorithms in production"
            description: >
              The organization maintains a complete and up-to-date inventory of all
              public-key algorithms in use (RSA, ECDSA, ECDH, DH, DSA) with location,
              key size, lifetime and criticality. ANSSI ref: Algorithm Selection Guide §3.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-02
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-G1
        ref_id: D1-02
        name: "Inventaire des certificats X.509 (PKI interne et externe)"
        description: >
          Tous les certificats X.509 sont répertoriés : CA racines, CA intermédiaires,
          certificats feuilles TLS, authentification, signature, chiffrement.
          Champs obligatoires : algorithme, taille clé, date expiration, émetteur, usage.
        importance: mandatory
        translations:
          en:
            name: "X.509 certificate inventory (internal and external PKI)"
            description: >
              All X.509 certificates are catalogued: root CAs, intermediate CAs,
              leaf certificates (TLS, authentication, signing, encryption).
              Mandatory fields: algorithm, key size, expiry date, issuer, usage.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-03
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-G1
        ref_id: D1-03
        name: "Cartographie des protocoles cryptographiques réseau"
        description: >
          Inventaire des protocoles réseau utilisant de la cryptographie asymétrique :
          TLS (version, suites), SSH, IPsec/IKE, S/MIME, OpenPGP, DNSSEC, OCSP, CRL.
          Identification des endpoints exposés à Internet vs internes.
        importance: mandatory
        translations:
          en:
            name: "Network cryptographic protocol mapping"
            description: >
              Inventory of network protocols using asymmetric cryptography:
              TLS (version, cipher suites), SSH, IPsec/IKE, S/MIME, OpenPGP, DNSSEC, OCSP, CRL.
              Identification of internet-facing vs internal endpoints.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-04
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-G1
        ref_id: D1-04
        name: "Inventaire des HSM et équipements cryptographiques matériels"
        description: >
          Recensement de tous les HSM (Hardware Security Modules), cartes à puce,
          TPM, tokens cryptographiques. Pour chaque équipement : fabricant, firmware,
          algorithmes supportés, capacité mise à jour PQC (firmware upgradeable ou remplacement requis).
        importance: mandatory
        translations:
          en:
            name: "HSM and hardware cryptographic equipment inventory"
            description: >
              Inventory of all HSMs, smart cards, TPMs, cryptographic tokens.
              For each device: vendor, firmware, supported algorithms,
              PQC upgrade path (firmware upgradeable vs hardware replacement required).

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-05
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-G1
        ref_id: D1-05
        name: "Inventaire des données à longue durée de sensibilité (HNDL)"
        description: >
          Identification des données chiffrées dont la confidentialité doit être
          garantie au-delà de 10 ans (données médicales, fiscales, secrets d'état,
          propriété intellectuelle). Ces données sont prioritaires pour la migration
          PQC en raison du risque Harvest Now, Decrypt Later.
        importance: mandatory
        translations:
          en:
            name: "Long-term sensitivity data inventory (HNDL threat)"
            description: >
              Identification of encrypted data requiring confidentiality beyond 10 years
              (medical, fiscal, state secrets, IP). These are priority PQC migration targets
              due to the Harvest Now, Decrypt Later threat.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-G2
        assessable: false
        depth: 2
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1
        ref_id: D1-G2
        name: "Classification et Priorisation"
        translations:
          en:
            name: "Classification and Prioritization"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-06
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-G2
        ref_id: D1-06
        name: "Classification des actifs cryptographiques par criticité"
        description: >
          Chaque actif cryptographique est classifié selon trois axes :
          (1) Impact si compromis (C/I/D), (2) Durée de vie requise des données,
          (3) Coût/délai de migration. Score de priorité PQC calculé et documenté.
        importance: mandatory
        translations:
          en:
            name: "Cryptographic asset classification by criticality"
            description: >
              Each cryptographic asset is classified on three axes:
              (1) Impact if compromised (C/I/A), (2) Required data lifetime,
              (3) Migration cost/timeline. PQC priority score calculated and documented.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-07
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-G2
        ref_id: D1-07
        name: "Identification des dépendances et chaînes cryptographiques"
        description: >
          Cartographie des dépendances entre systèmes cryptographiques :
          chaînes de confiance PKI, protocoles imbriqués (TLS dans VPN),
          systèmes legacy sans chemin de migration identifié.
          Documentation des dépendances bloquantes pour le plan de migration.
        importance: mandatory
        translations:
          en:
            name: "Cryptographic dependency and chain mapping"
            description: >
              Mapping of dependencies between cryptographic systems:
              PKI trust chains, nested protocols (TLS within VPN),
              legacy systems with no identified migration path.
              Documentation of blocking dependencies for the migration plan.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-08
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D1-G2
        ref_id: D1-08
        name: "Évaluation de l'exposition au risque HNDL"
        description: >
          Estimation du volume de données chiffrées potentiellement collectées
          par des adversaires étatiques (Harvest Now, Decrypt Later).
          Évaluation de la fenêtre temporelle de risque basée sur les estimations
          ANSSI/ENISA de disponibilité d'un ordinateur quantique cryptographiquement pertinent (CRQC).
        importance: mandatory
        translations:
          en:
            name: "HNDL risk exposure assessment"
            description: >
              Estimation of encrypted data volume potentially collected by state adversaries
              (Harvest Now, Decrypt Later). Risk window assessment based on
              ANSSI/ENISA estimates for a Cryptographically Relevant Quantum Computer (CRQC).

      # ============================================================
      # DOMAINE 2 — GOUVERNANCE ET PILOTAGE
      # ============================================================
      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2
        assessable: false
        depth: 1
        ref_id: D2
        name: "Gouvernance et Pilotage de la Migration"
        translations:
          en:
            name: "Migration Governance and Steering"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-G1
        assessable: false
        depth: 2
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2
        ref_id: D2-G1
        name: "Organisation et Responsabilités"
        translations:
          en:
            name: "Organization and Responsibilities"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-01
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-G1
        ref_id: D2-01
        name: "Désignation d'un responsable migration PQC (Crypto Officer)"
        description: >
          Un responsable nommément désigné pilote la migration PQC avec mandat
          explicite de la direction. Rôle, périmètre et autorité documentés.
          Compétences requises : cryptographie, PKI, gestion de projet.
        importance: mandatory
        translations:
          en:
            name: "Appointment of a PQC migration owner (Crypto Officer)"
            description: >
              A named owner leads PQC migration with explicit executive mandate.
              Role, scope and authority documented.
              Required skills: cryptography, PKI, project management.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-02
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-G1
        ref_id: D2-02
        name: "Comité de pilotage migration PQC constitué"
        description: >
          Existence d'un comité de pilotage incluant RSSI, DSI, DPO, représentant métier.
          Fréquence de réunion définie (minimum trimestrielle).
          Compte-rendus de réunion archivés et opposables.
        importance: mandatory
        translations:
          en:
            name: "PQC migration steering committee established"
            description: >
              Steering committee including CISO, CIO, DPO, business representative.
              Meeting frequency defined (minimum quarterly).
              Meeting minutes archived and auditable.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-03
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-G1
        ref_id: D2-03
        name: "Budget migration PQC alloué et approuvé"
        description: >
          Budget dédié à la migration PQC formellement approuvé par la direction.
          Couverture minimale : inventaire, tests, remplacement HSM, formation, audits.
          Horizon budgétaire aligné sur le plan de migration (minimum 3 ans).
        importance: mandatory
        translations:
          en:
            name: "PQC migration budget allocated and approved"
            description: >
              Dedicated PQC migration budget formally approved by management.
              Minimum coverage: inventory, testing, HSM replacement, training, audits.
              Budget horizon aligned with migration plan (minimum 3 years).

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-G2
        assessable: false
        depth: 2
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2
        ref_id: D2-G2
        name: "Politique Cryptographique"
        translations:
          en:
            name: "Cryptographic Policy"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-04
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-G2
        ref_id: D2-04
        name: "Politique cryptographique documentée et approuvée"
        description: >
          Document de politique cryptographique couvrant : algorithmes autorisés/interdits,
          tailles de clés minimales, durées de vie des clés/certificats,
          exigences HSM, procédures de renouvellement.
          Alignée sur les recommandations ANSSI en vigueur.
        importance: mandatory
        translations:
          en:
            name: "Cryptographic policy documented and approved"
            description: >
              Cryptographic policy document covering: allowed/forbidden algorithms,
              minimum key sizes, key/certificate lifetimes,
              HSM requirements, renewal procedures.
              Aligned with current ANSSI recommendations.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-05
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-G2
        ref_id: D2-05
        name: "Politique de crypto-agilité définie"
        description: >
          La politique cryptographique intègre un principe de crypto-agilité :
          capacité à remplacer un algorithme compromis en moins de 90 jours.
          Procédures de remplacement d'urgence documentées et testées.
          Référence ANSSI : Recommandations de sécurité relatives à TLS §4.
        importance: mandatory
        translations:
          en:
            name: "Crypto-agility policy defined"
            description: >
              Cryptographic policy embeds crypto-agility principle:
              ability to replace a compromised algorithm within 90 days.
              Emergency replacement procedures documented and tested.
              ANSSI ref: TLS Security Recommendations §4.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-06
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-G2
        ref_id: D2-06
        name: "Veille réglementaire et normative PQC assurée"
        description: >
          Processus de veille sur les publications ANSSI, NIST, ETSI, ENISA relatives
          à la cryptographie post-quantique. Responsable de veille désigné.
          Délai de prise en compte des nouvelles recommandations défini (<6 mois).
        importance: mandatory
        translations:
          en:
            name: "PQC regulatory and normative monitoring in place"
            description: >
              Monitoring process for ANSSI, NIST, ETSI, ENISA publications on PQC.
              Named monitoring owner. Deadline for incorporating new recommendations (<6 months).

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-G3
        assessable: false
        depth: 2
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2
        ref_id: D2-G3
        name: "Plan de Migration"
        translations:
          en:
            name: "Migration Plan"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-07
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-G3
        ref_id: D2-07
        name: "Plan de migration PQC formalisé avec jalons"
        description: >
          Document de plan de migration PQC avec : périmètre, jalons, responsables,
          dépendances, critères de succès. Horizon minimum 5 ans.
          Revue annuelle documentée. Approbation RSSI et direction.
        importance: mandatory
        translations:
          en:
            name: "Formalized PQC migration plan with milestones"
            description: >
              PQC migration plan document with: scope, milestones, owners,
              dependencies, success criteria. Minimum 5-year horizon.
              Annual review documented. CISO and management approval.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-08
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-G3
        ref_id: D2-08
        name: "Priorisation basée sur le risque HNDL documentée"
        description: >
          Le plan de migration priorise explicitement les systèmes protégeant
          des données à longue durée de sensibilité (>10 ans).
          Justification documentée pour chaque priorité de migration.
          Délais de migration des données HNDL critiques < 24 mois.
        importance: mandatory
        translations:
          en:
            name: "Risk-based prioritization (HNDL) documented"
            description: >
              Migration plan explicitly prioritizes systems protecting
              long-term sensitive data (>10 years).
              Documented justification for each migration priority.
              Critical HNDL data migration timeline < 24 months.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-09
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-G3
        ref_id: D2-09
        name: "Stratégie de migration hybride définie"
        description: >
          La stratégie de transition prévoit une phase hybride (classique + PQC simultanés)
          pour garantir la continuité de service et l'interopérabilité.
          Durée de la phase hybride définie. Critères de fin de phase hybride documentés.
          Référence : ANSSI, NIST SP 800-131A Rev.3.
        importance: mandatory
        translations:
          en:
            name: "Hybrid migration strategy defined"
            description: >
              Transition strategy includes a hybrid phase (classical + PQC simultaneously)
              to ensure service continuity and interoperability.
              Hybrid phase duration defined. Exit criteria documented.
              Reference: ANSSI, NIST SP 800-131A Rev.3.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-10
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D2-G3
        ref_id: D2-10
        name: "Gestion des fournisseurs et sous-traitants intégrée au plan"
        description: >
          Le plan de migration inclut les dépendances fournisseurs critiques :
          éditeurs logiciels, équipementiers réseau, prestataires PKI/CA.
          Clauses contractuelles PQC incluses dans les nouveaux contrats.
          Roadmap PQC des fournisseurs critiques obtenue et analysée.
        importance: mandatory
        translations:
          en:
            name: "Vendor and supplier management integrated in migration plan"
            description: >
              Migration plan includes critical vendor dependencies:
              software vendors, network equipment, PKI/CA providers.
              PQC contractual clauses included in new contracts.
              PQC roadmap from critical vendors obtained and analyzed.

      # ============================================================
      # DOMAINE 3 — SÉLECTION ALGORITHMIQUE (ANSSI)
      # ============================================================
      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3
        assessable: false
        depth: 1
        ref_id: D3
        name: "Sélection Algorithmique Post-Quantique"
        translations:
          en:
            name: "Post-Quantum Algorithm Selection"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-G1
        assessable: false
        depth: 2
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3
        ref_id: D3-G1
        name: "Algorithmes de Signature Numérique"
        translations:
          en:
            name: "Digital Signature Algorithms"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-01
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-G1
        ref_id: D3-01
        name: "Adoption de ML-DSA (FIPS 204 / CRYSTALS-Dilithium) pour les signatures"
        description: >
          ML-DSA est l'algorithme de signature PQC principal retenu par NIST (FIPS 204)
          et recommandé par l'ANSSI pour les usages de signature numérique.
          Niveau de sécurité minimum : ML-DSA-65 (niveau 3, équivalent 128 bits classique).
          Usage PKI : signature de certificats, CRL, OCSP, horodatage.
        importance: mandatory
        translations:
          en:
            name: "ML-DSA (FIPS 204 / CRYSTALS-Dilithium) adoption for signatures"
            description: >
              ML-DSA is the primary PQC signature algorithm standardized by NIST (FIPS 204)
              and recommended by ANSSI for digital signature use cases.
              Minimum security level: ML-DSA-65 (level 3, classical 128-bit equivalent).
              PKI use: certificate signing, CRL, OCSP, timestamping.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-02
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-G1
        ref_id: D3-02
        name: "Évaluation de SLH-DSA (FIPS 205 / SPHINCS+) pour les racines de confiance"
        description: >
          SLH-DSA (FIPS 205) est basé sur des fonctions de hachage — conservation
          de la preuve de sécurité même en cas de faiblesse des réseaux euclidiens.
          Recommandé pour les CA racines et les clés à très longue durée de vie.
          Impact : taille de signature plus grande (~8KB à ~50KB). Évaluation documentée.
        importance: recommended
        translations:
          en:
            name: "SLH-DSA (FIPS 205 / SPHINCS+) evaluation for trust anchors"
            description: >
              SLH-DSA (FIPS 205) is hash-based — security proof preserved even if
              lattice assumptions weaken. Recommended for root CAs and very long-lived keys.
              Trade-off: larger signature size (~8KB to ~50KB). Documented evaluation required.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-03
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-G1
        ref_id: D3-03
        name: "Évaluation de FN-DSA (FIPS 206 / FALCON) pour les cas contraints"
        description: >
          FN-DSA (FIPS 206) offre des signatures compactes (~700 octets) adaptées
          aux environnements contraints (IoT, cartes à puce, protocoles réseau).
          Complexité d'implémentation élevée (arithmétique sur réseaux NTRU cyclotomiques).
          Usage recommandé uniquement si la taille de signature est un critère bloquant.
        importance: recommended
        translations:
          en:
            name: "FN-DSA (FIPS 206 / FALCON) evaluation for constrained environments"
            description: >
              FN-DSA (FIPS 206) provides compact signatures (~700 bytes) for constrained
              environments (IoT, smart cards, network protocols).
              High implementation complexity (NTRU cyclotomic lattice arithmetic).
              Recommended only when signature size is a blocking constraint.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-G2
        assessable: false
        depth: 2
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3
        ref_id: D3-G2
        name: "Algorithmes d'Échange de Clés et Chiffrement"
        translations:
          en:
            name: "Key Exchange and Encryption Algorithms"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-04
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-G2
        ref_id: D3-04
        name: "Adoption de ML-KEM (FIPS 203 / CRYSTALS-Kyber) pour l'échange de clés"
        description: >
          ML-KEM est l'algorithme KEM (Key Encapsulation Mechanism) PQC standard NIST
          (FIPS 203). Recommandé pour TLS 1.3, SSH, IPsec.
          Niveau minimum : ML-KEM-768 (niveau 3). ML-KEM-1024 pour usages sensibles.
          Priorisé sur ML-KEM-512 (niveau 1 insuffisant pour données sensibles selon ANSSI).
        importance: mandatory
        translations:
          en:
            name: "ML-KEM (FIPS 203 / CRYSTALS-Kyber) adoption for key exchange"
            description: >
              ML-KEM is the NIST standard PQC KEM algorithm (FIPS 203).
              Recommended for TLS 1.3, SSH, IPsec.
              Minimum level: ML-KEM-768 (level 3). ML-KEM-1024 for sensitive use cases.
              ML-KEM-512 (level 1) insufficient for sensitive data per ANSSI.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-05
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-G2
        ref_id: D3-05
        name: "Mode hybride classique+PQC activé pour les échanges de clés"
        description: >
          Pendant la phase de transition, les échanges de clés combinent un algorithme
          classique (ECDH P-256 ou X25519) avec ML-KEM en mode hybride.
          Exemples : X25519+ML-KEM-768 (IETF draft-ietf-tls-hybrid-design).
          Le secret hybride est combiné de sorte que la sécurité soit celle du meilleur des deux.
        importance: mandatory
        translations:
          en:
            name: "Classical+PQC hybrid mode enabled for key exchanges"
            description: >
              During transition, key exchanges combine a classical algorithm
              (ECDH P-256 or X25519) with ML-KEM in hybrid mode.
              Examples: X25519+ML-KEM-768 (IETF draft-ietf-tls-hybrid-design).
              Hybrid secret combined so security equals the stronger of both components.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-06
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-G2
        ref_id: D3-06
        name: "Chiffrement symétrique renforcé (AES-256 minimum)"
        description: >
          Les algorithmes symétriques (AES, ChaCha20) résistent aux attaques quantiques
          avec doublement de la taille de clé effective (algorithme de Grover).
          AES-128 est insuffisant post-quantique. AES-256 minimum obligatoire.
          SHA-256 reste acceptable. SHA-384/SHA-512 recommandés pour les usages critiques.
        importance: mandatory
        translations:
          en:
            name: "Reinforced symmetric encryption (AES-256 minimum)"
            description: >
              Symmetric algorithms (AES, ChaCha20) resist quantum attacks with
              effective key size halved (Grover's algorithm).
              AES-128 insufficient post-quantum. AES-256 minimum mandatory.
              SHA-256 remains acceptable. SHA-384/SHA-512 recommended for critical use cases.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-G3
        assessable: false
        depth: 2
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3
        ref_id: D3-G3
        name: "Algorithmes Interdits et Dépréciation"
        translations:
          en:
            name: "Forbidden Algorithms and Deprecation"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-07
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-G3
        ref_id: D3-07
        name: "Plan de dépréciation de RSA documenté"
        description: >
          RSA est vulnérable à l'algorithme de Shor sur ordinateur quantique.
          Plan de remplacement de RSA (toutes tailles de clés) documenté et daté.
          RSA-2048 : migration planifiée avant 2030. RSA-4096 : toléré en phase hybride.
          Aucun nouveau déploiement RSA sans validation exceptionnelle du Crypto Officer.
        importance: mandatory
        translations:
          en:
            name: "RSA deprecation plan documented"
            description: >
              RSA is vulnerable to Shor's algorithm on a quantum computer.
              RSA replacement plan (all key sizes) documented and dated.
              RSA-2048: migration planned before 2030. RSA-4096: tolerated in hybrid phase.
              No new RSA deployment without exceptional Crypto Officer approval.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-08
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-G3
        ref_id: D3-08
        name: "Plan de dépréciation de ECDSA/ECDH documenté"
        description: >
          ECDSA et ECDH sur courbes elliptiques sont vulnérables à l'algorithme de Shor.
          Plan de remplacement documenté. ECDH P-256/X25519 tolérés en hybride PQC uniquement.
          ECDSA pour signatures : remplacement par ML-DSA planifié et daté.
          Courbes NIST P-384/P-521 : usage en phase hybride jusqu'en 2030 maximum.
        importance: mandatory
        translations:
          en:
            name: "ECDSA/ECDH deprecation plan documented"
            description: >
              ECDSA and ECDH on elliptic curves are vulnerable to Shor's algorithm.
              Replacement plan documented. ECDH P-256/X25519 tolerated in PQC hybrid only.
              ECDSA for signatures: replacement by ML-DSA planned and dated.
              NIST P-384/P-521 curves: hybrid phase use until 2030 maximum.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-09
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D3-G3
        ref_id: D3-09
        name: "Algorithmes interdits éliminés (MD5, SHA-1, DES, 3DES, RC4)"
        description: >
          Les algorithmes classiquement faibles sont interdits indépendamment de la menace quantique.
          MD5, SHA-1 : interdits pour signatures et intégrité. SHA-1 toléré HMAC uniquement.
          DES, 3DES, RC4 : interdits. AES-ECB : interdit. Export ciphers : interdits.
          Vérification active de l'absence de ces algorithmes dans les configurations TLS/SSH.
        importance: mandatory
        translations:
          en:
            name: "Forbidden algorithms eliminated (MD5, SHA-1, DES, 3DES, RC4)"
            description: >
              Classically weak algorithms are forbidden regardless of quantum threat.
              MD5, SHA-1: forbidden for signatures and integrity. SHA-1 tolerated for HMAC only.
              DES, 3DES, RC4: forbidden. AES-ECB: forbidden. Export ciphers: forbidden.
              Active verification of absence in TLS/SSH configurations required.

      # ============================================================
      # DOMAINE 4 — MIGRATION PKI ET CERTIFICATS
      # ============================================================
      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4
        assessable: false
        depth: 1
        ref_id: D4
        name: "Migration PKI et Certificats"
        translations:
          en:
            name: "PKI and Certificate Migration"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-G1
        assessable: false
        depth: 2
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4
        ref_id: D4-G1
        name: "Architecture PKI Post-Quantique"
        translations:
          en:
            name: "Post-Quantum PKI Architecture"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-01
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-G1
        ref_id: D4-01
        name: "Architecture PKI hybride définie (CA classique + CA PQC)"
        description: >
          Architecture cible définie pour la PKI post-quantique :
          Option A — PKI parallèle : CA PQC distincte de la CA classique.
          Option B — PKI hybride : CA émettant des certificats dual-key (ECDSA + ML-DSA).
          Option C — Migration progressive : remplacement CA par CA avec certificats croisés.
          Choix documenté avec justification technique et calendrier.
        importance: mandatory
        translations:
          en:
            name: "Hybrid PKI architecture defined (classical CA + PQC CA)"
            description: >
              Target architecture defined for post-quantum PKI:
              Option A — Parallel PKI: separate PQC CA from classical CA.
              Option B — Hybrid PKI: CA issuing dual-key certificates (ECDSA + ML-DSA).
              Option C — Progressive migration: CA replacement with cross-certificates.
              Choice documented with technical justification and timeline.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-02
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-G1
        ref_id: D4-02
        name: "CA racine PQC générée sur HSM certifié"
        description: >
          La nouvelle CA racine PQC est générée exclusivement sur HSM avec support PQC certifié.
          Cérémonie de génération de clé documentée et auditée.
          HSM conforme CC EAL4+ minimum, support ML-DSA et ML-KEM validé par le fabricant.
          Clé CA racine PQC en SLH-DSA si disponible sur le HSM cible.
        importance: mandatory
        translations:
          en:
            name: "PQC root CA generated on certified HSM"
            description: >
              New PQC root CA generated exclusively on HSM with certified PQC support.
              Key generation ceremony documented and audited.
              HSM compliant CC EAL4+ minimum, ML-DSA and ML-KEM support validated by vendor.
              PQC root CA key in SLH-DSA if available on target HSM.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-03
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-G1
        ref_id: D4-03
        name: "Chaîne de confiance hybride validée (cross-certification)"
        description: >
          La chaîne de confiance hybride est validée : les certificats CA classiques
          et PQC sont cross-certifiés pour garantir la continuité de validation
          pendant la phase de transition. Tests de validation effectués sur
          les principaux magasins de confiance (Windows, Linux, Java, navigateurs).
        importance: mandatory
        translations:
          en:
            name: "Hybrid trust chain validated (cross-certification)"
            description: >
              Hybrid trust chain validated: classical and PQC CA certificates
              are cross-certified to ensure continuous validation during transition.
              Validation tests performed on major trust stores
              (Windows, Linux, Java, browsers).

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-04
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-G1
        ref_id: D4-04
        name: "Support RFC 9480 (Certificate Management Protocol PQC) évalué"
        description: >
          Évaluation de la compatibilité du logiciel CA avec RFC 9480
          (Certificate Management Protocol updates for PQC) et
          RFC 9481 (algorithmes PQC dans CMP).
          Feuille de route du fournisseur CA obtenue pour le support PQC.
        importance: recommended
        translations:
          en:
            name: "RFC 9480 (CMP for PQC) support evaluated"
            description: >
              Evaluation of CA software compatibility with RFC 9480
              (Certificate Management Protocol updates for PQC) and
              RFC 9481 (PQC algorithms in CMP).
              CA vendor PQC support roadmap obtained.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-G2
        assessable: false
        depth: 2
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4
        ref_id: D4-G2
        name: "Cycle de Vie des Certificats PQC"
        translations:
          en:
            name: "PQC Certificate Lifecycle"

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-05
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-G2
        ref_id: D4-05
        name: "Durées de vie des certificats PQC définies et réduites"
        description: >
          Les certificats PQC ont des durées de vie adaptées au contexte de transition :
          Certificats TLS feuilles : maximum 90 jours (aligné CA/Browser Forum).
          Certificats d'authentification : maximum 1 an.
          CA intermédiaires : maximum 5 ans.
          CA racines PQC : maximum 20 ans (vs 25-30 ans classique).
        importance: mandatory
        translations:
          en:
            name: "PQC certificate lifetimes defined and reduced"
            description: >
              PQC certificate lifetimes adapted to transition context:
              TLS leaf certificates: maximum 90 days (aligned CA/Browser Forum).
              Authentication certificates: maximum 1 year.
              Intermediate CAs: maximum 5 years.
              PQC root CAs: maximum 20 years (vs 25-30 years classical).

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-06
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-G2
        ref_id: D4-06
        name: "Processus de renouvellement automatisé des certificats PQC"
        description: >
          L'automatisation du renouvellement est obligatoire pour les certificats
          à courte durée de vie (<1 an). Protocoles supportés : ACME (RFC 8555),
          CMP (RFC 9480), SCEP. Taux de renouvellement manuel < 5% de l'inventaire.
          Alertes automatiques sur les certificats en échec de renouvellement.
        importance: mandatory
        translations:
          en:
            name: "Automated PQC certificate renewal process"
            description: >
              Renewal automation mandatory for short-lived certificates (<1 year).
              Supported protocols: ACME (RFC 8555), CMP (RFC 9480), SCEP.
              Manual renewal rate < 5% of inventory.
              Automatic alerts on renewal failures.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-07
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-G2
        ref_id: D4-07
        name: "Infrastructure de révocation PQC opérationnelle (CRL/OCSP)"
        description: >
          L'infrastructure de révocation supporte les certificats PQC :
          CRL signées ML-DSA publiées et accessibles.
          Répondeurs OCSP compatibles ML-DSA opérationnels.
          Délai de révocation d'urgence < 1 heure documenté et testé.
          OCSP Stapling activé sur les serveurs TLS pour performance.
        importance: mandatory
        translations:
          en:
            name: "PQC revocation infrastructure operational (CRL/OCSP)"
            description: >
              Revocation infrastructure supports PQC certificates:
              ML-DSA signed CRLs published and accessible.
              ML-DSA compatible OCSP responders operational.
              Emergency revocation delay < 1 hour documented and tested.
              OCSP Stapling enabled on TLS servers for performance.

      - urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-08
        assessable: true
        depth: 3
        parent_urn: urn:trustinkey:risk:req_node:pqc-migration-anssi-v1:D4-G2
        ref_id: D4-08
        name: "Impact taille des clés et certificats PQC évalué"
        description: >
          L'impact opérationnel de la taille accrue des clés et certificats PQC est évalué :
          ML-DSA-65 : clé publique 1952 B, signature 3293 B (vs ECDSA P-256 : 64 B / 64 B).
          Impact sur TLS handshake, MTU réseau, performances d'authentification.
          Plan d'adaptation de l'infrastructure réseau (MTU, buffers, timeout) documenté.
        importance: mandatory
        translations:
          en:
            name: "PQC key and certificate size impact evaluated"
            description: >
              Operational impact of increased PQC key and certificate sizes evaluated:
              ML-DSA-65: public key 1952 B, signature 3293 B (vs ECDSA P-256: 64 B / 64 B).
              Impact on TLS handshake, network MTU, authentication performance.
              Network infrastructure adaptation plan (MTU, buffers, timeout) documented.

